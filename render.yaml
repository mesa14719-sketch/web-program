services:
  - type: web
    name: bot-hoster
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: geniralbrahim15@gmail.com
      - key: PYTHON_VERSION
        value: 3.11.9
